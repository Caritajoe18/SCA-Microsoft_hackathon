<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lenoff | Offline learning, Online Growth.</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

  <!-- Step 1 -->
  <div class="step" id="welcome">
    <h1>Lenoff</h1>
    <p>Offline learning, Online Growth.</p>
    <button class="btn-next" onclick="goTo('#register')">Get Started</button>
    <button class="btn-next" onclick="goTo('#login')">Login</button>


  </div>

  <!-- Step 2: Register -->
  <div class="step" id="register">
    <h2>Register</h2>
    <input type="text" placeholder="Full Name"><br><br>
    <input type="email" placeholder="Email"><br><br>
    <input type="password" placeholder="Password"><br><br>
    <button class="btn-prev" onclick="goTo('#welcome')">Back</button>
    <button class="btn-next" onclick="goTo('#interests')">Next</button>
  </div>

  <!-- Step 3: Login -->
  <div class="step" id="login">
    <h2>Login</h2>
    <input type="email" placeholder="Email"><br><br>
    <input type="password" placeholder="Password"><br><br>
    <button class="btn-prev" onclick="goTo('#welcome')">Back</button>
    <button class="btn-next" onclick="goTo('#dashboard')">Login</button>
  </div>

  <!-- Step 4: Interests -->
  <div class="step" id="interests">
    <h2>Select Interests</h2>
    <label><input type="checkbox"> Web Dev</label><br>
    <label><input type="checkbox"> Design</label><br>
    <label><input type="checkbox"> Editing</label><br>
    <button class="btn-prev" onclick="goTo('#register')">Back</button>
    <button class="btn-next" onclick="goTo('#dashboard')">Finish</button>
  </div>

  <!-- Step 5: Dashboard -->
  <div class="step" id="dashboard">
    <h2>🎊 Welcome to your Dashboard!</h2>
    <p>You’ve completed onboarding.</p>
    <button onclick="goTo('#welcome')">Logout</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
